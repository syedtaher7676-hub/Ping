worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with upstream latency metrics
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Low-latency optimization settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Client body buffers
    client_body_buffer_size 128k;
    client_max_body_size 10M;

    # Gzip compression for static web assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Connection upgrade mapping for WebSocket handshakes
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream Node.js cluster with IP hash for sticky session affinity
    upstream ping_cluster {
        ip_hash;
        server ping-node-1:3000 max_fails=3 fail_timeout=10s;
        server ping-node-2:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Standard proxy header configuration
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Load balancer health check endpoint
        location = /health {
            proxy_pass http://ping_cluster/health;
            proxy_set_header Connection "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
            access_log off;
        }

        # Dedicated location for Socket.io traffic
        location /socket.io/ {
            proxy_pass http://ping_cluster;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_connect_timeout 10s;
            chunked_transfer_encoding off;
        }

        # Main application reverse proxy route
        location / {
            proxy_pass http://ping_cluster;
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }
    }
}
