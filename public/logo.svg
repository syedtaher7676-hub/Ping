<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Background -->
    <linearGradient id="cleanVoid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0621"/>
      <stop offset="50%" stop-color="#080314"/>
      <stop offset="100%" stop-color="#030108"/>
    </linearGradient>

    <!-- 2028-30 Electric Gradient (Cyan -> Violet -> Magenta) -->
    <linearGradient id="kineticPulseClean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>   <!-- Electric Cyan -->
      <stop offset="45%" stop-color="#7000FF"/>  <!-- Deep Cyber Violet -->
      <stop offset="85%" stop-color="#FF007A"/>  <!-- High-Energy Magenta -->
      <stop offset="100%" stop-color="#FF5E00"/> <!-- Warm Pop -->
    </linearGradient>

    <!-- Glass Edge Border -->
    <linearGradient id="glassEdgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Clean Glow Effect -->
    <filter id="pureGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#cleanVoid)"/>
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="url(#glassEdgeBorder)" stroke-width="2.5"/>

  <!-- Pure Kinetic Ribbon P -->
  <g filter="url(#pureGlow)">
    <path d="M 180 380 V 180 C 180 142, 212 116, 258 116 C 314 116, 352 152, 352 205 C 352 258, 310 295, 258 295 H 180" 
          fill="none" 
          stroke="url(#kineticPulseClean)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
