<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 2028-30 Electric Gradient (Cyan -> Violet -> Magenta) -->
    <linearGradient id="kineticPulseCleanMark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>   <!-- Electric Cyan -->
      <stop offset="45%" stop-color="#7000FF"/>  <!-- Deep Cyber Violet -->
      <stop offset="85%" stop-color="#FF007A"/>  <!-- High-Energy Magenta -->
      <stop offset="100%" stop-color="#FF5E00"/> <!-- Warm Pop -->
    </linearGradient>

    <!-- Clean Glow Effect -->
    <filter id="pureGlowMark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pure Kinetic Ribbon P -->
  <g filter="url(#pureGlowMark)">
    <path d="M 180 380 V 180 C 180 142, 212 116, 258 116 C 314 116, 352 152, 352 205 C 352 258, 310 295, 258 295 H 180" 
          fill="none" 
          stroke="url(#kineticPulseCleanMark)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
